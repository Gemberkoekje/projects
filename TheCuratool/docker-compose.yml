services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: curatool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - curatool-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curatool"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: src/TheCuratool.Web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=curatool;Username=postgres;Password=postgres
      Database__AutoMigrate: "true"
    ports:
      - "8080:8080"

volumes:
  curatool-postgres:
