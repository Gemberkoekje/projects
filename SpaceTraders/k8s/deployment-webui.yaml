apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacetraders-webui
  namespace: spacetraders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spacetraders-webui
  template:
    metadata:
      labels:
        app: spacetraders-webui
    spec:
      containers:
        - name: webui
          # Pin to a specific SHA tag for production deployments; 'latest' is provided for local/dev use.
          image: spacetraders-webui:latest
          ports:
            - containerPort: 80
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: spacetraders-config
                  key: API_BASE_URL
                  optional: true
            - name: DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: spacetraders-secrets
                  key: DASHBOARD_API_KEY
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
