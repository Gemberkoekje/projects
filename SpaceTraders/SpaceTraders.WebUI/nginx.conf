server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets when available
    gzip_static on;

    # Health check endpoint — used by Kubernetes liveness/readiness probes.
    # Responds directly without touching the SPA so probes are lightweight.
    # Not logged: the probes would write 8 lines a minute into the namespace whose
    # log volume Grafana measures against the bot's budget (B40).
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Redirect the bare sub-path (no trailing slash) to the canonical form.
    location = /spacetraders/dashboard {
        return 301 /spacetraders/dashboard/;
    }

    # config.js is written at container startup — never cache it.
    # Strip the sub-path prefix before the file lookup.
    location = /spacetraders/dashboard/config.js {
        rewrite ^/spacetraders/dashboard/(.*)$ /$1 break;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Static assets are content-hashed — cache aggressively.
    location /spacetraders/dashboard/assets/ {
        rewrite ^/spacetraders/dashboard/(.*)$ /$1 break;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # All other routes under the dashboard sub-path fall back to index.html
    # so that client-side routing (React Router) handles them.
    location /spacetraders/dashboard/ {
        rewrite ^/spacetraders/dashboard/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
}
