; Upload limits where PHP runs as FPM or CGI (most shared hosting). With mod_php, .htaccess does this.
; A host may cap these lower; the beheer's Gegevens page shows what is in effect.
upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 512M
max_execution_time = 120
max_input_time = 300
max_file_uploads = 50
