# Local development and a stand-alone run. Production runs on the gembernodes k3s cluster (slice 4),
# against the cluster's shared PostgreSQL; this file is for your own machine.
#
#   docker compose up -d postgres     # just the database, then `dotnet run` the WebApp
#   docker compose up -d --build      # everything in containers (needs a published app, see Dockerfile)

services:
  postgres:
    image: postgres:17
    container_name: datumprikker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datumprikker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-datumprikker}
      TZ: Europe/Amsterdam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only, on 5436 so it does not clash with Kluskat (5434) or CharacterCreator (5435).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datumprikker} -d ${POSTGRES_DB:-datumprikker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapp:
    image: ghcr.io/gemberkoekje/datumprikker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datumprikker-webapp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEBAPP_PORT:-8086}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TZ: Europe/Amsterdam
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-datumprikker};Username=${POSTGRES_USER:-datumprikker};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      # Optional: each provider appears on the sign-in page only when both its values are set.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Authentication__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}

volumes:
  postgres_data:
