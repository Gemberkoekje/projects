# Local development and a stand-alone run. Production runs on the gembernodes k3s cluster (slice 6),
# against the cluster's shared PostgreSQL; this file is for your own machine.
#
#   docker compose up -d postgres     # just the database, then `dotnet run` the WebApp
#   docker compose up -d --build      # everything in containers (needs a published app, see Dockerfile)

services:
  postgres:
    image: postgres:17
    container_name: klaverjas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klaverjas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-klaverjas}
      TZ: Europe/Amsterdam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only, on 5437 so it does not clash with the other apps here (5432-5436).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klaverjas} -d ${POSTGRES_DB:-klaverjas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapp:
    image: ghcr.io/gemberkoekje/klaverjas:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klaverjas-webapp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEBAPP_PORT:-8088}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TZ: Europe/Amsterdam
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-klaverjas};Username=${POSTGRES_USER:-klaverjas};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Auth__Password: ${KLAVERJAS_PASSWORD:?Set KLAVERJAS_PASSWORD in .env}

volumes:
  postgres_data:
