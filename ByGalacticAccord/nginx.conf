# The site's server block (Dockerfile). The client is one page at / (the seed and the bench ride in the
# query string), so there is no fallback to index.html: a path that isn't a file is a 404.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The publish writes a .gz next to each asset; serve it to browsers that take gzip.
    gzip_static on;

    # For the pod's probes; touches nothing.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every file here has its content's fingerprint in its name (index.html's import map points at them),
    # so it never changes under the same name.
    location ^~ /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html, css/app.css, js/client.js and the fonts keep their names across builds: the browser asks
    # again each time (a 304 when unchanged), so a new deploy shows on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
