name: Build and Push DatumPrikker

on:
  push:
    branches: [main]
    paths:
      - 'DatumPrikker/**'
      - '.github/workflows/datumprikker-build-and-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DatumPrikker/**'
      - '.github/workflows/datumprikker-build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: DatumPrikker/**/packages.lock.json

      - name: Restore
        run: dotnet restore ./DatumPrikker/DatumPrikker.slnx

      - name: Build
        run: dotnet build ./DatumPrikker/DatumPrikker.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ./DatumPrikker/DatumPrikker.slnx --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: DatumPrikker/**/packages.lock.json

      # The Dockerfile is runtime-only: it copies what this step publishes.
      - name: Publish
        run: dotnet publish ./DatumPrikker/DatumPrikker.WebApp/DatumPrikker.WebApp.csproj --configuration Release --output ./DatumPrikker/publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push DatumPrikker image
        uses: docker/build-push-action@v6
        with:
          context: ./DatumPrikker
          file: ./DatumPrikker/Dockerfile
          push: true
          cache-from: type=gha,scope=datumprikker
          cache-to: type=gha,mode=max,scope=datumprikker
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/datumprikker:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/datumprikker:${{ github.sha }}
