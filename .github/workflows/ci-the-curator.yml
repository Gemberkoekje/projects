name: CI - The Curator

on:
  push:
    paths:
      - 'the-curator/**'
      - '.github/workflows/ci-the-curator.yml'
  pull_request:
    paths:
      - 'the-curator/**'
      - '.github/workflows/ci-the-curator.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.6.3'
  # SHA-512 of Godot's official downloads, from the release's SHA512-SUMS.txt. Checked before use;
  # update them together with GODOT_VERSION.
  GODOT_EDITOR_SHA512: 962c4f5fd3a704de36c9dedcb2f5f6c973065ac8ed8fd6e12c7ebf7e48c3852d774bcef2ccf76b50b206c0c564ceea54315e2943e76e397529923e7de680508e
  GODOT_TEMPLATES_SHA512: 6756c4c45cc711652fab0f5fbb75459f372f1f4b6cca6bb48e8953c25369418845c8cc39fcda0756effd69d0ecaf50e5653ebb9233b8e33f3bde5d8a81635168

jobs:
  build-test:
    name: Build + test (ubuntu)
    # Builds Curator.Core, its tests and the Godot C# project. The Godot project
    # compiles from the Godot.NET.Sdk NuGet package, so no Godot editor is needed.
    # The tests cover the rules, the replay, content validation and the balance
    # guardrails (BUILD_BRIEF §8.1-8.4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./the-curator/TheCurator.sln

      - name: Build
        run: dotnet build ./the-curator/TheCurator.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ./the-curator/TheCurator.sln --no-build --configuration Release --verbosity normal

  windows-build:
    name: Windows build (beta zip)
    # Exports the game for Windows with Godot and packs the zip a playtester downloads
    # (the-curator/tools/packaging/build-windows.sh). Every run keeps the zip as a workflow
    # artifact, so a pull request's build can be tried too; a push to main also publishes it
    # as a pre-release (beta-release, below).
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono
          key: godot-${{ env.GODOT_VERSION }}-mono-windows-v1

      - name: Install Godot and its Windows export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o editor.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          echo "${GODOT_EDITOR_SHA512}  editor.zip" | sha512sum -c -
          unzip -q editor.zip -d ~/godot
          curl -fsSL --retry 3 -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA512}  templates.tpz" | sha512sum -c -
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "${templates}"
          unzip -q -j templates.tpz templates/version.txt 'templates/windows_*_x86_64*.exe' -d "${templates}"
          rm editor.zip templates.tpz

      - name: Version
        id: version
        # 0.1.<run number>-beta: rises with every run of this workflow, so newer builds sort later.
        run: echo "version=0.1.${{ github.run_number }}-beta" >> "$GITHUB_OUTPUT"

      - name: Export and pack
        id: pack
        working-directory: the-curator
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          tools/packaging/build-windows.sh "${{ steps.version.outputs.version }}" build

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: TheCurator-${{ steps.version.outputs.version }}-windows
          path: ${{ steps.pack.outputs.zip }}
          retention-days: 14
          if-no-files-found: error

  beta-release:
    name: Beta release
    # Publishes the Windows zip as a pre-release named after its version, on every push to main
    # (or a manual run on main). Only this job may write to the repository.
    needs: windows-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: the-curator-beta-release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.windows-build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TheCurator-${{ needs.windows-build.outputs.version }}-windows

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="the-curator-v${VERSION}"
          zip="TheCurator-${VERSION}-windows.zip"
          cat > notes.md <<EOF
          A playtest build of The Curator for 64-bit Windows 10 or 11.

          **To play:** download \`${zip}\` below, unzip it anywhere and run \`TheCurator.exe\`. The build isn't signed, so Windows may warn about an unknown app: choose *More info*, then *Run anyway*. The README inside has the controls.

          Built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}.
          EOF
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${tag}" "${zip}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" "${zip}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
              --prerelease --latest=false --title "The Curator ${VERSION}" --notes-file notes.md
          fi
