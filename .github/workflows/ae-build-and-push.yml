name: Build and Push AdventureEngine

on:
  push:
    branches: [main]
    paths:
      - 'AdventureEngine/AdventureEngine.slnx'
      - 'AdventureEngine/Directory.Build.props'
      - 'AdventureEngine/src/AdventureEngine.Application/**'
      - 'AdventureEngine/src/AdventureEngine.Domain/**'
      - 'AdventureEngine/src/AdventureEngine.Infrastructure/**'
      - 'AdventureEngine/src/AdventureEngine.Web/**'
      - 'AdventureEngine/tests/AdventureEngine.Tests/**'
      - '.github/workflows/ae-build-and-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AdventureEngine/AdventureEngine.slnx'
      - 'AdventureEngine/Directory.Build.props'
      - 'AdventureEngine/src/AdventureEngine.Application/**'
      - 'AdventureEngine/src/AdventureEngine.Domain/**'
      - 'AdventureEngine/src/AdventureEngine.Infrastructure/**'
      - 'AdventureEngine/src/AdventureEngine.Web/**'
      - 'AdventureEngine/tests/AdventureEngine.Tests/**'
      - '.github/workflows/ae-build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./AdventureEngine.slnx

      - name: Build
        run: dotnet build ./AdventureEngine.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ./AdventureEngine.slnx --configuration Release --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push AdventureEngine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/AdventureEngine.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/adventureengine:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/adventureengine:${{ github.sha }}
