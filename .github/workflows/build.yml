name: Build Curatool

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TheCuratool.slnx

      - name: Build
        run: dotnet build TheCuratool.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TheCuratool.slnx --configuration Release --no-build --verbosity normal
