name: Build Curatool

on:
  push:
    branches: [main]
    paths:
      - 'TheCuratool/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'TheCuratool/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ./TheCuratool/TheCuratool.slnx

      - name: Build
        run: dotnet build ./TheCuratool/TheCuratool.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ./TheCuratool/TheCuratool.slnx --configuration Release --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Curatool image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./TheCuratool/src/TheCuratool.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/thecuratool:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/thecuratool:${{ github.sha }}
