name: Build and Push CharacterCreator

on:
  push:
    branches: [main]
    paths:
      - 'CharacterCreator/**'
      - '.github/workflows/charactercreator-build-and-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CharacterCreator/**'
      - '.github/workflows/charactercreator-build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./CharacterCreator/CharacterCreator.slnx

      - name: Build
        run: dotnet build ./CharacterCreator/CharacterCreator.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ./CharacterCreator/CharacterCreator.slnx --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The Dockerfile is runtime-only: it copies what this step publishes.
      - name: Publish
        run: dotnet publish ./CharacterCreator/CharacterCreator.WebApp/CharacterCreator.WebApp.csproj --configuration Release --output ./CharacterCreator/publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push CharacterCreator image
        uses: docker/build-push-action@v6
        with:
          context: ./CharacterCreator
          file: ./CharacterCreator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/charactercreator:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/charactercreator:${{ github.sha }}
