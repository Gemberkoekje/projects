name: CI - sts2 Viewer

on:
  push:
    branches: [main]
    paths:
      - 'sts2_decompiled/sts2_Viewer/**'
  pull_request:
    branches: [main]
    paths:
      - 'sts2_decompiled/sts2_Viewer/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ./sts2_decompiled/sts2_Viewer/sts2_Viewer.csproj

      - name: Build
        run: dotnet build ./sts2_decompiled/sts2_Viewer/sts2_Viewer.csproj --no-restore --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./sts2_decompiled/sts2_Viewer
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sts2viewer:latest
            ghcr.io/${{ github.repository_owner }}/sts2viewer:${{ github.sha }}
