name: CI - sts2 Viewer

on:
  push:
    branches: [main]
    paths:
      - 'sts2_decompiled/sts2_Viewer/**'
  pull_request:
    branches: [main]
    paths:
      - 'sts2_decompiled/sts2_Viewer/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-sts2viewer-${{ runner.os }}-${{ hashFiles('sts2_decompiled/sts2_Viewer/**/*.csproj', 'sts2_decompiled/sts2_Viewer/**/Directory.Packages.props', 'sts2_decompiled/sts2_Viewer/**/Directory.Build.props', 'sts2_decompiled/sts2_Viewer/**/packages.lock.json') }}
          restore-keys: |
            nuget-sts2viewer-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ./sts2_decompiled/sts2_Viewer/sts2_Viewer.csproj

      - name: Build
        run: dotnet build ./sts2_decompiled/sts2_Viewer/sts2_Viewer.csproj --no-restore --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        run: echo "REPOSITORY_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./sts2_decompiled/sts2_Viewer
          push: true
          cache-from: type=gha,scope=sts2viewer
          cache-to: type=gha,mode=max,scope=sts2viewer
          tags: |
            ghcr.io/${{ env.REPOSITORY_OWNER_LC }}/sts2viewer:latest
            ghcr.io/${{ env.REPOSITORY_OWNER_LC }}/sts2viewer:${{ github.sha }}
