name: CI - By Galactic Accord

on:
  push:
    paths:
      - 'ByGalacticAccord/**'
      - '.github/workflows/ci-bygalacticaccord.yml'
  pull_request:
    paths:
      - 'ByGalacticAccord/**'
      - '.github/workflows/ci-bygalacticaccord.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (ubuntu)
    # The same check as the plan's "green before main" rule (ByGalacticAccord/plan.md §2):
    # a Release build with warnings as errors, the fast tests, the soak-length tests, then the browser check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./ByGalacticAccord/ByGalacticAccord.slnx

      - name: Build
        run: dotnet build ./ByGalacticAccord/ByGalacticAccord.slnx --no-restore --configuration Release

      # The test project's default filter skips soak-length tests.
      - name: Test (fast)
        run: dotnet test ./ByGalacticAccord/ByGalacticAccord.slnx --no-build --configuration Release --verbosity normal

      - name: Test (soak)
        run: dotnet test ./ByGalacticAccord/ByGalacticAccord.slnx --no-build --configuration Release --verbosity normal --filter Category=Soak

      # The browser check (plan §2): publishes the client, drives it in Chromium, screenshots it, fails on
      # console errors, and compares the engine's state in WebAssembly with desktop .NET.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the browser check
        working-directory: ./ByGalacticAccord/tools/client-check
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser check
        working-directory: ./ByGalacticAccord/tools/client-check
        run: node check.cjs

      - name: Upload the browser check's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-check-screenshots
          path: ByGalacticAccord/artifacts/client-check/screenshots
          if-no-files-found: ignore

  # The site's image (ByGalacticAccord/Dockerfile), pushed only from main and only once the check above
  # is green. gembernodes (apps/bygalacticaccord) deploys a sha from here: bump its tag to roll it out.
  docker:
    name: Image (ghcr.io)
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push the By Galactic Accord image
        uses: docker/build-push-action@v6
        with:
          context: ./ByGalacticAccord
          file: ./ByGalacticAccord/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/bygalacticaccord:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/bygalacticaccord:${{ github.sha }}
