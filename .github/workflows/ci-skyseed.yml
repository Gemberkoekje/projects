name: CI - Skyseed

on:
  push:
    branches: [main]
    paths:
      - 'Skyseed/**'
      - '.github/workflows/ci-skyseed.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Skyseed/**'
      - '.github/workflows/ci-skyseed.yml'
  workflow_dispatch:

permissions:
  contents: read

# Build + gametest every Stonecutter version node, one job each, with that node's required JDK
# (1.21.1 -> Java 21, 26.1.2 -> Java 25). This is the CI "matrix"; locally, `./gradlew chiseledBuild`
# (and chiseledRunGameTestServer) fan the same tasks across all nodes in one invocation.
jobs:
  build:
    name: ${{ matrix.mcver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mcver: '1.21.1'
            java: '21'
          - mcver: '26.1.2'
            java: '25'

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: |
            Skyseed/*.gradle*
            Skyseed/gradle/wrapper/gradle-wrapper.properties

      - name: Build + gametests (${{ matrix.mcver }})
        working-directory: Skyseed
        run: |
          chmod +x ./gradlew
          ./gradlew ":${{ matrix.mcver }}:build" ":${{ matrix.mcver }}:runGameTestServer" --no-configuration-cache --stacktrace
