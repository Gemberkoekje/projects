name: CI - SpaceTraders

on:
  push:
    branches: [main]
    paths:
      - 'SpaceTraders/**'
      - '.github/workflows/ci-spacetraders.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SpaceTraders/**'
      - '.github/workflows/ci-spacetraders.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore ./SpaceTraders/SpaceTraders.API/SpaceTraders.API.csproj
          dotnet restore ./SpaceTraders/SpaceTraders.App/SpaceTraders.App.csproj

      - name: Build
        run: |
          dotnet build ./SpaceTraders/SpaceTraders.API/SpaceTraders.API.csproj --no-restore --configuration Release
          dotnet build ./SpaceTraders/SpaceTraders.App/SpaceTraders.App.csproj --no-restore --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./SpaceTraders/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/spacetraders-api:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/spacetraders-api:${{ github.sha }}

      - name: Build and push App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./SpaceTraders/Dockerfile.app
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/spacetraders-app:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/spacetraders-app:${{ github.sha }}
