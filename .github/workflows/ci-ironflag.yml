name: CI - IronFlag

on:
  push:
    paths:
      - 'IronFlag/unity/**'
      - '.github/workflows/ci-ironflag.yml'
  pull_request:
    paths:
      - 'IronFlag/unity/**'
      - '.github/workflows/ci-ironflag.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_PROJECT_PATH: IronFlag/unity

jobs:
  test:
    name: Unity EditMode + PlayMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-IronFlag-${{ hashFiles(format('{0}/Assets/**', env.UNITY_PROJECT_PATH), format('{0}/Packages/**', env.UNITY_PROJECT_PATH), format('{0}/ProjectSettings/**', env.UNITY_PROJECT_PATH)) }}
          restore-keys: |
            Library-IronFlag-

      # Requires the repo secrets UNITY_LICENSE (+ UNITY_EMAIL/UNITY_PASSWORD, or a
      # UNITY_SERIAL, for activation) to be configured. Without a license this job
      # fails at the license-activation step rather than silently skipping tests.
      - name: Run Unity tests (EditMode + PlayMode)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          testMode: all
          artifactsPath: ironflag-test-results
          checkName: IronFlag Test Results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironflag-test-results
          path: ironflag-test-results

  build:
    name: Build (StandaloneWindows64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-IronFlag-${{ hashFiles(format('{0}/Assets/**', env.UNITY_PROJECT_PATH), format('{0}/Packages/**', env.UNITY_PROJECT_PATH), format('{0}/ProjectSettings/**', env.UNITY_PROJECT_PATH)) }}
          restore-keys: |
            Library-IronFlag-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: StandaloneWindows64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ironflag-build-StandaloneWindows64
          path: build/StandaloneWindows64
