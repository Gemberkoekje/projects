name: CI - IronFlag

on:
  push:
    paths:
      - 'IronFlag/unity/**'
      - '.github/workflows/ci-ironflag.yml'
  pull_request:
    paths:
      - 'IronFlag/unity/**'
      - '.github/workflows/ci-ironflag.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_PROJECT_PATH: IronFlag/unity

jobs:
  test:
    name: Unity EditMode + PlayMode tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the exact Editor version/build-target pinned in
      # ProjectSettings/ProjectVersion.txt (no docker container involved, so the
      # license activated below applies to the same Editor that runs the tests).
      - name: Setup Unity
        id: unity-setup
        uses: buildalon/unity-setup@v2
        with:
          version-file: ${{ env.UNITY_PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt
          build-targets: StandaloneWindows64
          cache-installation: true

      # Unity Personal has no exportable license file - it's activated by logging
      # into the Unity account (same as Unity Hub's login/logout activation cycle).
      # Requires the repo secrets UNITY_EMAIL/UNITY_PASSWORD to be configured.
      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run EditMode tests
        shell: pwsh
        run: |
          & "${{ steps.unity-setup.outputs.unity-editor-path }}" -batchmode -nographics -projectPath "${{ env.UNITY_PROJECT_PATH }}" -runTests -testPlatform EditMode -testResults "${{ github.workspace }}/ironflag-test-results/editmode-results.xml" -logFile -

      - name: Run PlayMode tests
        shell: pwsh
        run: |
          & "${{ steps.unity-setup.outputs.unity-editor-path }}" -batchmode -nographics -projectPath "${{ env.UNITY_PROJECT_PATH }}" -runTests -testPlatform PlayMode -testResults "${{ github.workspace }}/ironflag-test-results/playmode-results.xml" -logFile -

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironflag-test-results
          path: ironflag-test-results

  build:
    name: Build (StandaloneWindows64)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Unity
        id: unity-setup
        uses: buildalon/unity-setup@v2
        with:
          version-file: ${{ env.UNITY_PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt
          build-targets: StandaloneWindows64
          cache-installation: true

      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build project
        shell: pwsh
        run: |
          & "${{ steps.unity-setup.outputs.unity-editor-path }}" -batchmode -nographics -quit -projectPath "${{ env.UNITY_PROJECT_PATH }}" -buildWindows64Player "${{ github.workspace }}/build/StandaloneWindows64/IronFlag.exe" -logFile -

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ironflag-build-StandaloneWindows64
          path: build/StandaloneWindows64
