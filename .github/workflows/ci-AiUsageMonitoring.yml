name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore ./AiUsageMonitoring/src/AiUsageMonitor/AiUsageMonitor.csproj
          dotnet restore ./AiUsageMonitoring/tests/AiUsageMonitor.Tests/AiUsageMonitor.Tests.csproj

      - name: Build
        run: dotnet build ./AiUsageMonitoring/src/AiUsageMonitor/AiUsageMonitor.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test ./AiUsageMonitoring/tests/AiUsageMonitor.Tests/AiUsageMonitor.Tests.csproj --no-restore --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        run: echo "REPOSITORY_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./AiUsageMonitoring
          file: ./AiUsageMonitoring/src/AiUsageMonitor/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_OWNER_LC }}/aiusagemonitor:latest
            ghcr.io/${{ env.REPOSITORY_OWNER_LC }}/aiusagemonitor:${{ github.sha }}
