name: Build and Push HackerMinigames

on:
  push:
    branches: [main]
    paths:
      - 'HackerMinigames/**'
      - '.github/workflows/hackerminigames-build-and-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'HackerMinigames/**'
      - '.github/workflows/hackerminigames-build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./HackerMinigames/HackerMinigames.slnx

      - name: Build
        run: dotnet build ./HackerMinigames/HackerMinigames.slnx --no-restore --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner for image tags
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push HackerMinigames image
        uses: docker/build-push-action@v6
        with:
          context: ./HackerMinigames
          file: ./HackerMinigames/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/hackerminigames:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/hackerminigames:${{ github.sha }}
